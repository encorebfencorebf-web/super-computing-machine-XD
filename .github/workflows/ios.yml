name: Test Lime Rebuild
on: workflow_dispatch

jobs:
  test:
    name: NDK ${{ matrix.ndk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ndk: [r21e, r25c, r27c]
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: ${{ matrix.ndk }}

      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flxanimate git
          haxelib set hxdiscord_rpc git

      - name: Check NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          grep Revision $ANDROID_NDK_HOME/source.properties

      - name: Rebuild Lime for Android
        run: |
          LIME=$(haxelib libpath lime)
          echo "Lime path: $LIME"
          echo "== ndll SEBELUM"
          find "$LIME/ndll" -name "*.so" -exec ls -la {} + || echo "Tidak ada .so"
          haxelib run lime rebuild android -arm64
          echo "== ndll SESUDAH"
          find "$LIME/ndll" -name "*.so" -exec ls -la {} + || echo "Tidak ada .so"

      - name: Check emutls in liblime.so
        run: |
          LIME=$(haxelib libpath lime)
          for f in $(find "$LIME/ndll" -name "liblime*.so"); do
            echo "== $f"
            readelf --dyn-syms "$f" | grep __emutls_get_address || echo "Tidak ada referensi emutls"
          done
