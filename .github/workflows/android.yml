name: Android Build
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Installing/Updating libraries
        run: |
          haxe -cp commandline -D analyzer-optimize --run Main setup -s

      - name: Configure Android
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Fix Haxelib
        run: |
          haxelib set lime git
          haxelib set hxcpp git
          haxelib set flixel git
          haxelib set flixel-addons git
          haxelib set flxanimate git
          haxelib set hxdiscord_rpc git

      - name: Print versions
        run: |
          haxelib list | grep -E "^(lime|hxcpp)" || true
          LIME=$(haxelib libpath lime)
          ls -la "$LIME/ndll/Android/"
          sha256sum "$LIME/ndll/Android/liblime-64.so"

      - name: Building the game
        run: |
          haxelib run lime build android -final -D ONLY_ARM64

      - name: Patch liblime.so in APK
        run: |
          set -e
          LIME=$(haxelib libpath lime)
          GOOD="${LIME}ndll/Android/liblime-64.so"
          APK=$(ls $GITHUB_WORKSPACE/export/release/android/bin/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Good lib: $GOOD"
          readelf --dyn-syms "$GOOD" | grep __emutls_get_address
          echo "APK: $APK"
          echo "Build tools: $BT"

          cp "$APK" /tmp/work.apk
          mkdir -p /tmp/p/lib/arm64-v8a
          cp "$GOOD" /tmp/p/lib/arm64-v8a/liblime.so
          (cd /tmp/p && zip -0 -X /tmp/work.apk lib/arm64-v8a/liblime.so)
          zip -d /tmp/work.apk 'META-INF/*' || true

          "$BT/zipalign" -p -f 4 /tmp/work.apk /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks key.keystore \
            --ks-pass pass:psychengine \
            --ks-key-alias psychport \
            --key-pass pass:psychengine \
            --out "$APK" /tmp/aligned.apk
          "$BT/apksigner" verify "$APK"

      - name: Inspect native libs
        run: |
          APK=$(ls export/release/android/bin/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          rm -rf /tmp/apk && mkdir -p /tmp/apk && unzip -q "$APK" -d /tmp/apk
          ls -la /tmp/apk/lib/arm64-v8a/
          for f in /tmp/apk/lib/arm64-v8a/*.so; do
            echo "== $f"
            readelf --dyn-syms "$f" | grep __emutls_get_address || true
          done

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/release/*
