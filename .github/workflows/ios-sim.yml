name: Inspect APK
on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          REPO=${{ github.repository }}

          echo "== Daftar release"
          gh release list --repo $REPO || true

          echo "== Coba download dari release mobile-legacy"
          gh release download mobile-legacy --repo $REPO --pattern "*.apk" --dir /tmp/dl || echo "Gagal download dari release"

          if [ -z "$(find /tmp/dl -name '*.apk')" ]; then
            echo "== Coba download dari artifact"
            for WF in "Release" "Android Build"; do
              for RUN in $(gh run list --repo $REPO --workflow "$WF" --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
                echo "Coba run $RUN ($WF)"
                if gh run download "$RUN" --repo $REPO --name "Codename Engine Android" --dir /tmp/dl; then
                  break 2
                fi
              done
            done
          fi

          echo "== Isi /tmp/dl"
          find /tmp/dl -type f
          if [ -z "$(find /tmp/dl -name '*.apk')" ]; then
            echo "Tidak ada APK ditemukan"
            exit 1
          fi

      - name: Inspect native libs
        run: |
          APK=$(find /tmp/dl -name '*.apk' | head -1)
          echo "APK: $APK"
          mkdir -p /tmp/apk && unzip -q "$APK" -d /tmp/apk
          ls -la /tmp/apk/lib/arm64-v8a/
          for f in /tmp/apk/lib/arm64-v8a/*.so; do
            echo "== $f"
            readelf --dyn-syms "$f" | grep __emutls_get_address || true
          done
