name: Inspect APK
on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from latest successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl
          for RUN in $(gh run list --repo ${{ github.repository }} --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            echo "Trying run $RUN"
            if gh run download "$RUN" --repo ${{ github.repository }} --name "Codename Engine Android" --dir /tmp/dl; then
              echo "Downloaded from run $RUN"
              break
            fi
          done
          ls -la /tmp/dl

      - name: Inspect native libs
        run: |
          APK=$(ls /tmp/dl/*.apk | head -1)
          echo "APK: $APK"
          mkdir -p /tmp/apk && unzip -q "$APK" -d /tmp/apk
          ls -la /tmp/apk/lib/arm64-v8a/
          for f in /tmp/apk/lib/arm64-v8a/*.so; do
            echo "== $f"
            readelf --dyn-syms "$f" | grep __emutls_get_address || true
          done
