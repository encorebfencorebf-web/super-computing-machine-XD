name: Check Library Changes

# Mencari commit library git yang masuk SETELAH build hijau pertama.
# Tidak mem-build apa pun, hanya membaca riwayat repo library (semuanya publik).

on:
  workflow_dispatch:
    inputs:
      green_time:
        description: "Waktu library dipasang pada build HIJAU (UTC)"
        default: "2026-11-17T11:30:00Z"
      red_time:
        description: "Waktu library dipasang pada build MERAH (UTC)"
        default: "2026-11-18T08:56:00Z"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Cek riwayat tiap library
        env:
          GREEN: ${{ inputs.green_time }}
          RED: ${{ inputs.red_time }}
        run: |
          mkdir -p work && cd work
          # nama|url|branch (kosong = branch default)
          LIBS='
          mobile-controls|https://github.com/ArkoseLabsOfficial/mobile-controls|
          openfl|https://github.com/CodenameCrew/cne-openfl|old
          lime|https://github.com/ArkoseLabsOfficial/lime|
          flixel|https://github.com/CodenameCrew/cne-flixel|old
          flixel-addons|https://github.com/CodenameCrew/cne-flixel-addons|old
          hscript-improved|https://github.com/CodenameCrew/hscript-improved|custom-classes
          flxanimate|https://github.com/CodenameCrew/cne-flxanimate|
          hxdiscord_rpc|https://github.com/CodenameCrew/cne-hxdiscord_rpc|old
          away3d|https://github.com/CodenameCrew/away3d|
          '
          S="$GITHUB_STEP_SUMMARY"
          echo "# Perubahan library" >> "$S"
          echo "Jendela: hijau = \`$GREEN\`, merah = \`$RED\`" >> "$S"
          echo >> "$S"
          CHANGED=""
          echo "$LIBS" | while IFS='|' read -r name url branch; do
            [ -z "$name" ] && continue
            if [ -n "$branch" ]; then
              git clone -q --filter=blob:none --single-branch --branch "$branch" "$url" "$name" || { echo "GAGAL clone $name" >> "$S"; continue; }
            else
              git clone -q --filter=blob:none "$url" "$name" || { echo "GAGAL clone $name" >> "$S"; continue; }
            fi
            cd "$name"
            PIN=$(git rev-list -1 --before="$GREEN" HEAD)
            TIP=$(git rev-parse HEAD)
            {
              echo "## $name  (${branch:-default})"
              echo "- url: $url"
              echo "- commit terakhir sebelum build hijau (kandidat pin): \`${PIN:-?}\`"
              echo "- commit paling baru sekarang: \`$TIP\`"
              echo
              echo "Commit setelah build hijau:"
              echo '```'
              git log --since="$GREEN" --format='%h %cI %an  %s' HEAD | head -40
              echo '```'
              echo "Di antara hijau dan merah (ini yang paling dicurigai):"
              echo '```'
              git log --since="$GREEN" --until="$RED" --format='%h %cI %an  %s' HEAD | head -40
              echo '```'
              echo
            } >> "$S"
            cd ..
          done
